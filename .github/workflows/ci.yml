name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
  AUTH_SECRET: stub-secret-for-ci-min-32-chars-long!!
  AUTH_GOOGLE_ID: stub-google-id
  AUTH_GOOGLE_SECRET: stub-google-secret
  NEXTAUTH_URL: http://localhost:3000
  UPSTASH_REDIS_REST_URL: https://stub.upstash.io
  UPSTASH_REDIS_REST_TOKEN: stub-token
  UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
  UPSTASH_VECTOR_REST_TOKEN: stub-token
  QSTASH_TOKEN: stub-token
  QSTASH_CURRENT_SIGNING_KEY: stub-signing-key
  QSTASH_NEXT_SIGNING_KEY: stub-signing-key
  RESEND_API_KEY: re_stub_key_for_ci
  POLAR_ACCESS_TOKEN: stub-token
  POLAR_WEBHOOK_SECRET: polar_whs_stub_for_ci
  POLAR_PRODUCT_ID_STARTER: 00000000-0000-0000-0000-000000000001
  POLAR_PRODUCT_ID_GROWTH: 00000000-0000-0000-0000-000000000002
  POLAR_PRODUCT_ID_ENTERPRISE: 00000000-0000-0000-0000-000000000003
  INFERENCE_API_SECRET: stub-inference-secret-min-32-chars!!
  INFERENCE_SERVICE_URL: http://localhost:8000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  typecheck:
    name: Type Check (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: apps/web

      - name: Type check
        run: bunx tsc --noEmit
        working-directory: apps/web

  lint-web:
    name: Lint (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: apps/web

      - name: Lint
        run: bun run lint
        working-directory: apps/web

  build-web:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: [typecheck, lint-web]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        working-directory: apps/web

      - name: Build
        run: bun run build
        working-directory: apps/web

  lint-python:
    name: Lint (Python / Inference)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .
        working-directory: apps/inference

      - name: Ruff format check
        run: ruff format --check .
        working-directory: apps/inference

  build-extension:
    name: Build (Chrome Extension)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/extension

      - name: Build
        run: bun run build
        working-directory: packages/extension
