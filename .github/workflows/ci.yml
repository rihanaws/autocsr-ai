name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
        env:
          # Stub env vars so Next.js config doesn't error during lint
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          AUTH_SECRET: stub-secret-for-ci
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub-token
          UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: stub-token

  build-web:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          AUTH_SECRET: stub-secret-for-ci-min-32-chars-long!!
          NEXTAUTH_URL: http://localhost:3000
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub-token
          UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: stub-token
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  lint-python:
    name: Lint Python (Inference)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/inference

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
