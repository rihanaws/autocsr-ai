<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCSR Collector</title>
    <style>
      body { width: 280px; padding: 16px; font-family: sans-serif; background: #0f0f14; color: #fff; margin: 0; }
      h1 { font-size: 14px; font-weight: 700; margin: 0 0 12px; }
      button { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
      #start { background: #4f46e5; color: #fff; }
      #stop { background: #1e1e2a; color: #a5b4fc; border: 1px solid #2a2a3a; }
      #export-xml { background: #16161f; color: #6ee7b7; border: 1px solid #2a2a3a; }
      #export-enc { background: #16161f; color: #f9a8d4; border: 1px solid #2a2a3a; }
      #status { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
      #stats { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 2px; }
    </style>
  </head>
  <body>
    <h1>AutoCSR Collector</h1>
    <button id="start">Start Session</button>
    <button id="stop">Stop Session</button>
    <button id="export-xml">Export XML</button>
    <button id="export-enc">Export Encrypted JSON</button>
    <div id="status">Status: idle</div>
    <div id="stats"></div>
    <div id="setup-section" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06)">
      <p style="color:#606075;font-size:11px;margin:0 0 6px">Tenant ID not configured</p>
      <input id="tenant-input" type="text" placeholder="Paste your tenant ID"
        style="width:100%;box-sizing:border-box;background:#141420;border:1px solid rgba(255,255,255,0.1);
               color:#e8e8f0;border-radius:4px;padding:4px 8px;font-size:11px;font-family:monospace"/>
      <button id="save-tenant"
        style="margin-top:6px;width:100%;padding:4px;background:#4f46e5;color:white;
               border:none;border-radius:4px;cursor:pointer;font-size:11px">
        Save &amp; Start Capture
      </button>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
